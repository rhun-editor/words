# Words: completes the word you are typing with the words of your open files, the most used first.
# Written in C++17 on rhunext.h. https://rhun.app/extensions/v1/ section 12b.
name = words
owner = rhun-editor
title = Words
description = Completes the word you are typing with words from your open files, most used first.
icon = icon.png
color = #3f9f6f
version = 0.1.0
protocol = 1
# started by its command, and by [provides] when the first file opens
on = command
run.linux-x86_64 = bin/words-linux-x86_64
run.macos-arm64 = bin/words-macos-arm64
run.windows-x64 = bin/words-windows-x64.exe

[commands]
stats = Count Distinct Words

[provides]
complete = *

[subscribe]
opened = *

[needs]
documents = read
